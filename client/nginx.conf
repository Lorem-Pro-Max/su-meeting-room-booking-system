server {
    listen 8794;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # จัดการทุกพาร์ทที่ถูกส่งมาจาก Proxy (ทั้งแบบตัดพาร์ทและไม่ตัด)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # กรณีที่ Proxy ยังเหลือพาร์ท /booking ติดมา
    location /booking {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
