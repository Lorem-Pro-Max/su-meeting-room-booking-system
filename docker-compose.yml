# ตรึง subnet ไว้ เพื่อให้ gateway เป็น 172.21.0.1 เสมอ
# (ใช้ใน DATABASE_URL และต้องเปิดสิทธิ์ใน ufw + pg_hba.conf ให้ subnet นี้)
networks:
  default:
    ipam:
      config:
        - subnet: 172.21.0.0/16

services:
  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: su-meeting-backend
    restart: unless-stopped
    ports:
      - "6081:6081"
    environment:
      NODE_ENV: production
      PORT: 6081
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL}
    volumes:
      - ./server/logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:6081/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=${VITE_API_BASE}
        - IOT_SERVICE_BASE_URL=${IOT_SERVICE_BASE_URL}
    container_name: su-meeting-frontend
    restart: unless-stopped
    # environment:
    #   - VITE_API_BASE=${VITE_API_BASE}
    #   - IOT_SERVICE_BASE_URL=${IOT_SERVICE_BASE_URL}
    ports:
      - "8794:8794"
